name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build y lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Desplegar a Hetzner
    needs: ci
    runs-on: ubuntu-latest
    # Solo despliega cuando:
    #   - la variable DEPLOY_ENABLED del repo esté en "true" (se configura desde GitHub → Settings → Variables)
    #   - y el evento es un push real (no workflow_dispatch sin configurar aún)
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' }}
    steps:
      - name: SSH + pull + build + reload
        uses: appleboy/ssh-action@v1.2.0
        env:
          # PM 2026-06-26: claves de Stripe inyectadas al .env del server
          # en cada deploy. Si los secrets están vacíos, se omiten — no se
          # borran valores previos. Permite agregar/rotar keys desde
          # GitHub → Settings → Secrets sin tocar SSH.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main

            # PM 2026-06-26: sync de las claves de Stripe al .env.local
            # del server. Solo escribe si el secret está definido en
            # GitHub. Si está vacío, mantiene el valor actual.
            touch .env.local
            if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
              sed -i '/^STRIPE_SECRET_KEY=/d' .env.local
              echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" >> .env.local
            fi
            if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
              sed -i '/^STRIPE_WEBHOOK_SECRET=/d' .env.local
              echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" >> .env.local
            fi

            # Diagnóstico: imprime qué variables de Stripe quedaron en
            # .env.local SIN exponer los valores. Util para confirmar que
            # el secret llegó al server.
            echo "[deploy] Stripe envs presentes en .env.local:"
            grep -E '^STRIPE_' .env.local | sed -E 's/=.*/=***SET***/' || echo "(ninguna)"

            npm ci --no-audit --no-fund
            npm run build
            # pm2 restart (no reload) para forzar relectura del .env.local.
            # `reload` mantiene el process activo y a veces conserva env
            # vars viejas; `restart` hace kill+spawn y siempre relee.
            pm2 restart prdise --update-env || pm2 start npm --name prdise -- start
            pm2 save
