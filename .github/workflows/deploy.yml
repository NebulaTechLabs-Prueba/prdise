name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build y lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Desplegar a Hetzner
    needs: ci
    runs-on: ubuntu-latest
    # Solo despliega cuando:
    #   - la variable DEPLOY_ENABLED del repo esté en "true" (se configura desde GitHub → Settings → Variables)
    #   - y el evento es un push real (no workflow_dispatch sin configurar aún)
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' }}
    steps:
      - name: SSH + pull + build + reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            npm run build
            pm2 reload prdise || pm2 start npm --name prdise -- start
            pm2 save
